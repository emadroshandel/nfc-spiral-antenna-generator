name: deploy web app

# Publishes the browser version to GitHub Pages:
#   https://emadroshandel.github.io/nfc-spiral-antenna-generator/
#
# The page loads nfc_spiral.py + nfc_api.py at run time and executes them under
# Pyodide, so the online app, the desktop app and the CLI always run
# byte-identical code -- there is no second implementation to keep in sync.
# The site is only published if the test suite passes.
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test before publishing
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          pytest -q tests/

      - name: Assemble the site
        run: python scripts/build_site.py --out _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
